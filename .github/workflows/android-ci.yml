name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Validate project
        run: gradle projects --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Report signing mode
        run: |
          if [ -n "${{ secrets.SIGNING_STORE_FILE }}" ]; then
            echo "### Signing: GitHub Secrets keystore used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Signing: no release secrets configured - APK/AAB are signed with the debug key" >> "$GITHUB_STEP_SUMMARY"
            echo "Add SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD to produce publishable artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dakhlo-kharj-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/dakhlo-kharj-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/dakhlo-kharj-release.aab
          ls -lh dist
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-debug-apk
          path: dist/dakhlo-kharj-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-release-apk
          path: dist/dakhlo-kharj-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-release-aab
          path: dist/dakhlo-kharj-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
